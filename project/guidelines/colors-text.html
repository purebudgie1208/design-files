<!-- @dsCard group="Colors" viewport="700x150" name="Text roles" subtitle="Four levels of ink on light, two on dark" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--white);font-family:var(--font-core)}.w{padding:18px 22px}</style></head><body><div class="w" style="display:grid;grid-template-columns:1fr 1fr;gap:0;font-size:14px">
<div style="padding:14px 16px;background:var(--white);display:flex;flex-direction:column;gap:7px">
<span style="color:var(--text-strong)">--text-strong · headlines</span><span style="color:var(--text-body)">--text-body · paragraphs</span><span style="color:var(--text-muted)">--text-muted · descriptions</span><span style="color:var(--text-faint)">--text-faint · metadata</span></div>
<div style="padding:14px 16px;background:var(--surface-inverse);display:flex;flex-direction:column;gap:7px;border-radius:8px">
<span style="color:var(--text-on-dark)">--text-on-dark · headlines</span><span style="color:var(--text-on-dark-muted)">--text-on-dark-muted · body</span><span style="color:var(--text-accent)">--text-accent · gold emphasis</span></div></div></body></html>
