<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--white);font-family:var(--font-core)}.w{padding:18px 22px}</style></head><body><div class="w"><div id="i" style="display:flex;gap:26px;align-items:center;color:var(--ink-000)"></div>
<div style="font-size:10.5px;color:var(--text-faint);margin-top:14px">graduation-cap · landmark · globe · book-open-text · chevron-down · chevron-right · arrow-up-right · arrow-right · search — never filled, never coloured, never emoji</div></div>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.js"></script>
<script>const names=["graduation-cap","landmark","globe","book-open-text","chevron-down","chevron-right","arrow-up-right","arrow-right","search"];
document.getElementById("i").innerHTML=names.map(n=>'<i data-lucide="'+n+'"></i>').join("");lucide.createIcons({attrs:{width:26,height:26,"stroke-width":1.5}});</script></body></html>
