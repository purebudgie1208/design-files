<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--white);font-family:var(--font-core)}.w{padding:18px 22px}body{background:var(--surface-canvas)}</style></head><body><div class="w" style="display:flex;gap:18px;align-items:center">
<div style="text-align:center"><div style="width:120px;height:74px;background:var(--white);border-radius:14px;box-shadow:var(--shadow-chip)"></div><div style="font-size:10.5px;color:var(--text-strong);margin-top:9px">--shadow-chip</div></div><div style="text-align:center"><div style="width:120px;height:74px;background:var(--white);border-radius:14px;box-shadow:var(--shadow-raised)"></div><div style="font-size:10.5px;color:var(--text-strong);margin-top:9px">--shadow-raised</div></div><div style="text-align:center"><div style="width:120px;height:74px;background:var(--white);border-radius:14px;box-shadow:var(--shadow-card)"></div><div style="font-size:10.5px;color:var(--text-strong);margin-top:9px">--shadow-card</div></div><div style="text-align:center"><div style="width:120px;height:74px;background:var(--white);border-radius:14px;box-shadow:var(--shadow-shell)"></div><div style="font-size:10.5px;color:var(--text-strong);margin-top:9px">--shadow-shell</div></div>
<div style="text-align:center"><div style="width:120px;height:74px;background:var(--surface-inverse-raised);border-radius:14px;box-shadow:var(--shadow-inverse)"></div><div style="font-size:10.5px;color:var(--text-strong);margin-top:9px">--shadow-inverse</div></div></div></body></html>
